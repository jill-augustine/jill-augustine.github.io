name: jill

services:
  buildsite: &compose_build
      build:
        context: .
        dockerfile: Dockerfile
        args:
          - RUBY_VERSION=3.2.5
          - JEKYLL_VERSION=4.3.3
      volumes: &compose_mounts
      - "./gems:/jekyll/gems/."
      - "./src:/jekyll/src/."
      - "./docs:/jekyll/docs/."
      - "./Gemfile:/jekyll/Gemfile"
      - "./Gemfile.lock:/jekyll/Gemfile.lock"
      command: bundle exec jekyll build
  servesite:
    <<: *compose_build
    ports:
      - "127.0.0.1:4000:4000"
    command: bundle exec jekyll serve --host 0.0.0.0
